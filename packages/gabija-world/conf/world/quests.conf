// Melia
// Configuration file
//----------------------------------------------------------------------------

// If enabled, quest objectives are displayed in the quest detail
// window and the quest tracker.
display_quest_objectives: yes

// If enabled, a completed quest can be handed in from the quest detail
// window with a Complete button instead of by talking to its NPC. The
// detail window's Return button is replaced by Complete, but the tracker's
// return warp (Backspace) still works while quest_return_button is enabled.
quest_completion_from_ui: no

// If enabled, a completed quest can be warped back to its NPC, from the
// detail window's Return button and the tracker's return warp (Backspace).
quest_return_button: yes

include "/user/conf/world/quests.conf"

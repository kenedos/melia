// Melia
// Configuration file
//----------------------------------------------------------------------------

// Blue Jackpot monster configuration ------------------------------
// Chance for a monster to spawn with the SuperExp buff in percent,
// giving them a blue effect and increasing their EXP.
blue_jackpot_spawn_chance: 0.25

// EXP rate for monsters killed while they have the SuperExp buff
// active in percent.
blue_jackpot_exp_rate: 2000

// The minimum map level for a monster to have a chance to become a
// blue jackpot monster. If set to 0, it can happen on any map.
blue_jackpot_min_level: 30

// Silver Jackpot monster configuration ----------------------------
// Chance for a monster to spawn with the SuperDrop buff in percent,
// giving them a silver effect and increasing the amount of their
// drops.
silver_jackpot_spawn_chance: 1.0

// The number of times a SuperDrop monster rolls its drop table.
// For example, if this is 5, the monster tries to drop all its
// items 5 separate times. This allows the same item to drop
// multiple times.
silver_jackpot_rolls: 5

// Guarantees at least one item drop that has a drop chance above this
// threshold. Set to 100 to disable, or to 0 to drop all items in the
// monster drop table at least once.
silver_guaranteed_item_threshold: 10.0

// The minimum map level for a monster to have a chance to become a
// silver jackpot monster. If set to 0, it can happen on any map.
silver_jackpot_min_level: 20

// Gold Jackpot monster configuration -----------------------------
// Chance for a monster to spawn with the TwinkleBuff buff in percent,
// giving them a golden effect and increasing the amount of their
// drops.
gold_jackpot_spawn_chance: 0.1

// The number of times a TwinkleBuff monster rolls its drop table.
// For example, if this is 5, the monster tries to drop all its
// items 5 separate times. This allows the same item to drop
// multiple times.
gold_jackpot_rolls: 20

// Guarantees at least one item drop that has a drop chance above this
// threshold. Set to 100 to disable, or to 0 to drop all items in the
// monster drop table at least once.
gold_guaranteed_item_threshold: 5.0

// The minimum map level for a monster to have a chance to become a
// gold jackpot monster. If set to 0, it can happen on any map.
gold_jackpot_min_level: 30

// Elite monster configuration ------------------------------------
// Chance for a monster to spawn as an elite monster in percent.
// Elites have boosted stats, minions, and unique attacks.
elite_spawn_chance: 0.25

// Percentage based multiplier for an elite monster's HP and SP.
elite_hpsp_rate: 450

// Percentage based multiplier for an elite monster's remaining
// stats. Used as the default for the attack and defense rates
// below when those are not set.
elite_stat_rate: 140

// Percentage based multiplier for an elite monster's physical and
// magical attack.
elite_atk_rate: 350

// Percentage based multiplier for an elite monster's physical and
// magical defense.
elite_def_rate: 350

// Percentage based multiplier for an elite monster's secondary
// stats, such as evasion, hit rate, critical rate, critical
// resistance, and block.
elite_secondary_stat_rate: 100

// The EXP rate of elite monsters in percent.
elite_exp_rate: 2000

// The number of times an elite monster rolls its drop table. For
// example, if this is 5, the monster tries to drop all its items
// 5 separate times. This allows the same item to drop multiple
// times.
elite_rolls: 10

// Guarantees at least one item drop that has a drop chance above this
// threshold. Set to 100 to disable, or to 0 to drop all items in the
// monster drop table at least once.
elite_guaranteed_item_threshold: 5.0

// The minimum map level for a monster to have a chance to become
// an elite monster. If set to 0, monsters can become elite on any
// map.
elite_min_level: 50

// If set to true, elites are always aggressive, even if they would
// otherwise be peaceful mobs.
elite_always_aggressive: true

// Red Jackpot monster configuration --------------------------------
// Chance for a monster to spawn with the SuperMonGen buff in percent,
// giving them a red effect and making additional mobs spawn after they
// are killed.
red_jackpot_spawn_chance: 0.25

// The minimum map level for a monster to have a chance to become a
// red jackpot monster. If set to 0, it can happen on any map.
red_jackpot_min_level: 40

// The number of waves the red jackpot monster will generate will be a random
// number between these values.
red_wave_min: 7
red_wave_max: 10

// The amount of monsters per wave for the red jackpot monster.
// This is for a mob level 100, amount will scale linearly to monster level.
red_wave_monster_count: 12

// The delay, in seconds, between red jackpot monster waves. This will be a random
// number between these values.
red_wave_delay_min: 10
red_wave_delay_max: 15

// Mythic monster configuration -------------------------------------
// Mythic monsters are powerful variants with unique mechanics.
// They can spawn naturally or be created via >spawnbuff command.

// Chance for a monster to spawn as a mythic monster in percent.
// A random mythic buff is chosen from the available pool.
mythic_spawn_chance: 0.05

// The minimum map level for a monster to have a chance to become mythic.
mythic_min_level: 75

// If set to true, mythic monsters are always aggressive.
mythic_always_aggressive: true

// Percentage based multiplier for a mythic monster's HP and SP.
mythic_hpsp_rate: 600

// Percentage based multiplier for a mythic monster's remaining
// stats. Used as the default for the attack and defense rates
// below when those are not set.
mythic_stat_rate: 150

// Percentage based multiplier for a mythic monster's physical and
// magical attack.
mythic_atk_rate: 375

// Percentage based multiplier for a mythic monster's physical and
// magical defense.
mythic_def_rate: 375

// Percentage based multiplier for a mythic monster's secondary
// stats, such as evasion, hit rate, critical rate, critical
// resistance, and block.
mythic_secondary_stat_rate: 125

// The EXP rate of mythic monsters in percent.
mythic_exp_rate: 5000

// The number of times a mythic monster rolls its drop table.
mythic_rolls: 30

// Guarantees at least one item drop above this threshold.
mythic_guaranteed_item_threshold: 5.0

include "/user/conf/world/rare_monsters.conf"

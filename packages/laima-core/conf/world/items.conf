// Melia
// Configuration file
//----------------------------------------------------------------------------

// Multiplier that affects an item's cooldown. If this value is increased,
// all item cooldowns increase. For example, with a rate of 2, cooldowns
// take twice as long, while 0.5 reduces them by half. If set to 0, items
// don't have a cooldown.
item_cooldown_rate: 1.0

// Enables the Goddess Bills currency system. When enabled, the server
// will add custom names and descriptions for paper currency items that
// can be exchanged with the Silver Exchanger NPC (if enabled via scripts).
// This feature is disabled by default.
goddess_bills_enabled: no

// Controls whether multiple skill gems for the same skill stack their
// skill level bonuses. When disabled, only the highest level gem for a
// given skill takes effect, no matter how many are socketed or which
// equipment they're socketed into. Colored gems are not affected.
// If you enable this, remove the duplicate skill gem warning popup from
// SCR_GEM_ITEM_SELECT in the client's ui.ipf/uiscp/game.lua.
stack_duplicate_skill_gems: no

// Controls whether skill gems can grant skills the character hasn't
// learned. When disabled, a skill gem only raises the level of a skill
// the character already spent points on. When enabled, a gem can also
// grant an unlearned skill, as long as one of the character's jobs has
// it in its skill tree and has reached its unlock level.
skill_gems_grant_new_skills: no

include "/user/conf/world/items.conf"

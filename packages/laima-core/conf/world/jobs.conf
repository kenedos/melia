// Melia
// Configuration file
//----------------------------------------------------------------------------

// Allow advancement of jobs only through quests if true
// else through the UI.
use_job_quests: false

// Splits advanced jobs into 3 class circles (C1/C2/C3), each with its own
// skill subset and its own job level band of 1~15. A circle takes a full rank,
// and advancing one resets job level to 1 while keeping earned skill points.
// Base jobs never get circles.
//
// The client must be patched to match. What it needs:
//
// ies/xp_job
//   10 ranks x 15 levels (150 rows), the running total of db/exp.txt row for
//   row. The client works the job level out from the EXP it holds against this
//   table, and picks the rank by counting jobs rather than circles, so the row
//   it reads is not the one the job is really on. The server maps the job's
//   level and progress onto the rank the client will read, which lands it on
//   the right level whatever that rank turns out to be.
//
// ies/sharedconst
//   Entry 90001 CLASS_CIRCLE_SYSTEM_ENABLED, UseInScript YES. The server pushes
//   this switch into it as an IesMod, along with max_advanced_job_level into
//   105 CLASS_MAX_LEVEL and the rank ladder cap into 100050 JOB_CHANGE_MAX_RANK.
//
// script/skilltree_condition.lua
//   Holds the circle state and its accessors: LAIMA_SET_JOB_CIRCLES,
//   GET_JOB_CIRCLE, GET_JOB_CIRCLE_LEVEL, GET_JOB_EFFECTIVE_LEVEL,
//   GET_ACTIVE_JOB_ID, GET_TOTAL_JOB_RANK, IS_JOB_CIRCLE_ADVANCEABLE,
//   IsMyJobCircleCapped, GET_SKILLTREE_MAXLV, GET_CIRCLE_STARTEXT. The server
//   pushes circles as the addon message LAIMA_JOB_CIRCLES, string argument
//   "<jobId>:<circle>:<level> ..." and active job id as the numeric argument.
//
// script/skill/skill_enable_get_shared.lua
//   GET_LIMIT_SKILL_LEVEL and the skill unlock check read GET_SKILLTREE_MAXLV
//   and GET_JOB_EFFECTIVE_LEVEL instead of the raw job level.
//
// addon/changejobbutton
//   The single registrant of LAIMA_JOB_CIRCLES; refreshes the HUD button, the
//   HUD job emblem and an open changejob window from its handler.
//
// addon/changejob
//   Greys out only base jobs and jobs already at C3, uses Caption1 for the
//   description, tests "own job" against GET_ACTIVE_JOB_ID, and adds a
//   classCircle richtext with the format "Circle: %s".
//
// addon/skillability
//   Reads GET_SKILLTREE_MAXLV for the skill cap, up button and MAX/lock state.
//   GET_TREE_INFO_BY_CLS derives the job class name from the skill tree class
//   name by stripping the trailing _%d+.
//
// addon/partyinfo, addon/headsupdisplay
//   Circle stars on the own-job tooltip and the HUD class icon.
//
// Notes:
// - Advancement is confirmed with CustomCommand("CLICK_CHANGEJOB_BUTTON"), not
//   a packet.
// - Every circle takes the next rank of the ladder and only the newest one
//   earns exp, so a rank's curve is set by how many advancements came before
//   it rather than by which job it belongs to.
// - The job list sent to the client carries no usable level or grade field:
//   the level it derives from the exp, and its rank counts jobs. The exp sent
//   is therefore the mapped figure, and so is every job exp delta, or the bar
//   drifts off the absolute between level ups.
// - The rank ladder is one continuous climb rather than the stock job curves
//   laid end to end. Those each restart low, which reads as an exp drop every
//   time the ladder crosses from one of them to the next.
// - The last level of a rank is never reached, since a job's exp stops one
//   level short of it and the circle is advanced out of instead.
// - Skill tree data is unchanged; a skill's circle is ceil(unlockLevel / 15).
// - Job exp saved against 45-level curves recomputes to level 15 of circle 1,
//   so existing characters need re-advancing.
class_circle_system: yes

// The max rank players can reach.
//
// class_circle_system enabled: one rank is spent per class circle, plus
// one for the base job.
//   e.g. rank 10 (1 base + 3x3 circles) = Swordsman + Peltasta C3 +
//   Hoplite C3 + Highlander C3.
//
// class_circle_system disabled: one rank is spent per job instead.
//   e.g. rank 4 (1 base + 3 jobs) = Swordsman + Peltasta + Hoplite +
//   Highlander.
job_max_rank: 7

// If enabled, players can no longer change jobs via the advancement UI.
no_advancement: no

// If enabled, players can no longer rank reset via de advancement UI.
no_rank_reset: yes

// Max Level
// Default : 510
max_level : 99

// Max Companion Level
// Default : 520
max_companion_level : 99

// Max Base Job Level
// Default : 15
max_base_job_level: 15

// Max Advanced Job Level
// Default : 45
// Under class_circle_system a job only levels 1~15 per circle, and the
// circle takes the place of the old levels 16~45.
max_advanced_job_level: 15

// Stat Points
// Default : 1
stats_per_level: 1

// 1 Extra Stat Points is awarded every
// time the character reaches each of the
// given levels.
// Default: 0
extra_stats_levels: 30, 60, 80, 90

include "/user/conf/world/jobs.conf"

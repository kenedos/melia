// Laima
// Configuration file
//----------------------------------------------------------------------------

default_min_respawn: 2
default_max_respawn: 3

// Ambush configuration ---------------------------------------------
// Chance in percent, per second, for an ambush to trigger while a
// player walks inside the spawn area of an aggressive monster
// spawner. Standing still never triggers one. Ambushes only happen
// on field maps, never in cities, dungeons, or instances. Set to 0
// to disable.
ambush_chance: 0.5

// The amount of monsters an ambush spawns.
ambush_min_monsters: 3
ambush_max_monsters: 4

// The distance from the player the ambushing monsters spawn at.
ambush_distance: 30

// The time in seconds before a player can be ambushed again.
ambush_cooldown_seconds: 60

// Combat reaction configuration ------------------------------------
// Chance in percent, per hit taken, for a monster to call nearby
// allies of its own kind onto its attacker. Bosses and elites use
// their own, much higher chances.
monster_help_call_chance: 0.3

// Chance in percent, per hit taken, for a peaceful monster to panic,
// running from its attacker for ten seconds while dragging nearby
// allies of its own kind along. Only normal, non-elite monsters on
// non-instanced maps panic.
monster_panic_flee_chance: 0.3

// Chance in percent, per hit taken, for a monster to ascend into an
// elite, healing to full and gaining the elite buff. Only applies on
// non-instanced maps, and to monsters at or above elite_min_level
// from rare_monsters.conf.
monster_elite_ascension_chance: 0.0005

// Patrol configuration ---------------------------------------------
// Monsters on dungeon maps can walk routes between the centers of the
// rooms and corridors around them, which are generated from the map's
// ground data the first time players enter it. Only aggressive,
// normal rank monsters that can move patrol, and never in instanced
// dungeons.
patrol_enabled: true

// Chance in percent for an eligible monster to lead a patrol.
patrol_chance: 5

// The amount of monsters that follow a patrol leader, and how close
// to it they have to be to join it. Only monsters of the leader's own
// kind join, and one that can't gather any doesn't patrol at all, so
// patrols always move as a group of the same monster. A patrol keeps
// picking up its own kind as it walks, up to its group size.
patrol_group_size: 5
patrol_group_radius: 250

// If set to true, monsters walk their routes instead of running them.
patrol_walk: false

// Node generation. The ground is sampled every few units, and the
// points that sit furthest away from the walls around them become
// nodes, one per room and a chain of them along every corridor.
// Smaller steps find narrower passages at the cost of a longer build.
patrol_node_sample_step: 25

// The minimum distance to the nearest wall for a point to become a
// node, which keeps doorways and wall edges out of the graph.
patrol_node_min_clearance: 40

// The minimum distance between two nodes.
patrol_node_spacing: 200

// The maximum length of a connection between two nodes. Nodes are
// only connected if nothing blocks the straight line between them.
patrol_edge_max_length: 600

// How far from its starting node a route may reach, and how many
// nodes it may string together.
patrol_route_radius: 4800
patrol_route_max_nodes: 24

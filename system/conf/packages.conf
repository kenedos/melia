// Melia
// Configuration File
//---------------------------------------------------------------------------

// Comma-separated list of enabled package names.
// Packages are loaded from the packages/ directory.
// Each package can provide handler overrides, database files,
// scripts, and SQL updates that extend the base server.
// Packages split by concern, loaded in order:
//   laima-core   - calculations, AI, items, shared systems (world-agnostic)
//   laima-skills - player skills, buffs, abilities, pads
//   world-shared - track NPCs and instanced dungeons, shared by every world
//   laima-world  - Laima's NPCs, spawns, warps, quests and dungeons
//   gabija-world - the 2016 world's NPCs, spawns, warps and quests
//
// Exactly one world package should be enabled at a time.
// Example: enabled_packages: laima-core, laima-skills, world-shared, gabija-world
enabled_packages: laima-core, laima-skills, world-shared, laima-world

include "/user/conf/packages.conf"

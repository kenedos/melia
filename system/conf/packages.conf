// Melia
// Configuration File
//---------------------------------------------------------------------------

// Comma-separated list of enabled package names, loaded from the packages/
// directory in the order given. Later packages override earlier ones.
//
// What a package is
//   A package is a self-contained, swappable building block. It carries a
//   package.conf manifest that names its type.
//   Data merges by id over system/ folder and over the packages before it.
//
//   Everything that is not owned by a package type lives in system/ itself:
//   the game systems (quests, party, gems, mixing and so on), item, AI and
//   monster skill scripts, client addons, the formulas and their feature
//   switches, and the track NPCs and instanced dungeons. Packages only add
//   data, conf and content on top of it.
//
// Package types
//   Only one package of each type may be enabled at a time. The server
//   refuses to start otherwise, because two packages of a type provide the
//   same content and collide.
//
//   core   - The game's rules and databases: the mechanics profile
//            (db/features.txt, conf/world/*.conf) and items, monsters,
//            maps, exp, recipes, cards, drops, global drops and companions.
//   skills - The player's kit: skill, buff, ability and pad handlers, plus
//            their databases (skills, abilities, skilltree, jobs, simony).
//   world  - The places and people: NPCs, monster spawns, warps, quests,
//            cutscene tracks, treasures, minigames, shops and the starting
//            map.
//
// Packages
//   laima-core   [core]   The 390044 client's data with Laima's custom items,
//                         monsters, drops and recipes.
//                         The experience curve, class circle system (if enabled),
//                         max level 99, rare monster tuning and quality of life
//                         features.
//   gabija-core  [core]   The 2016 game, mirrored from the 2016 client.
//                         Items, recipes, monsters, exp table,
//                         maps, companions and map ranks, with the 2016
//                         mechanics (class circles, max level 330, max
//                         rank 10, the 2016 formulas) and the default rates.
//   laima-skills [skills] Laima's player skills, buffs, abilities and pads.
//                         Works with either core and either world.
//   laima-world  [world]  Laima's world: the current client's maps with
//                         Laima's NPCs, spawns, warps, quests, treasures
//                         and minigames.
//   gabija-world [world]  The 2016 world: spawns, NPCs, warps, quests and
//                         cutscenes (tracks) rebuilt from the 2016 client.
//
// Combining packages
//   A core, a skills and a world package make a full server, and any core
//   can be paired with any world as long as the maps they use exist in the
//   core's maps.txt. Pair the client patch with the same packages.
//
// Examples
//   Laima's server:            laima-core, laima-skills, laima-world
//   The 2016 server:           gabija-core, laima-skills, gabija-world
//   2016 world, Laima rules:   laima-core, laima-skills, gabija-world
//
// Leaving the list empty runs vanilla Melia without any of this.
//
// By default, we use gabija-world with laima-core. This produces
// a configuration with 2016 world map and quests together with
// Laima's custom max level 99, items, mechanics, etc.
//
enabled_packages: laima-core, laima-skills, laima-world

include "/user/conf/packages.conf"
